name: Eval Gate
on:
  pull_request:
    paths:
      - 'src/Hope.Agent.AgentRuntime/**'
      - 'src/Hope.Agent.LLMGateway/**'
      - 'src/Hope.Agent.Application/Agents/**'
      - 'src/Hope.Agent.Application/Prompts/**'

jobs:
  eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Run Eval Suite
        run: dotnet run --project tools/hope-eval.ps1
        env:
          EVAL_OPENAI_KEY: ${{ secrets.EVAL_OPENAI_KEY }}
      - name: Quality Gate
        id: gate
        run: |
          REGRESSION=$(cat eval-results.json | jq '.regression')
          echo "Regression: $REGRESSION%"
          echo "regression=$REGRESSION" >> $GITHUB_OUTPUT
          if [ "$REGRESSION" -gt 5 ]; then
            echo "::error::Regression > 5% — blocking deploy"
            exit 1
          fi
      - name: PR Comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('eval-results.json', 'utf8'));
            const body = `## 🤖 Eval Gate Results
            | Metric | Score |
            |--------|-------|
            | Overall | ${results.overall} |
            | Regression | ${results.regression}% |
            | Clinical QA | ${results.clinical_qa} |
            | Scheduling | ${results.scheduling} |
            | Hallucination Rate | ${results.hallucination_rate}% |
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
