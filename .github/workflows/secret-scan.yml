name: secret-scan

on:
    push:
        branches: ["main", "develop"]
    pull_request:
        branches: ["*"]
    schedule:
        - cron: "30 3 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
