name: dast-zap-baseline

on:
    schedule:
        - cron: "0 4 * * 2" # Every Tuesday 04:00 UTC
    workflow_dispatch:
        inputs:
            target_url:
                description: "Full URL to scan (e.g. https://staging.hope.hospital.com)"
                required: true
                default: ""

permissions:
    contents: read
    issues: write # ZAP action opens an issue on findings

jobs:
    zap-baseline:
        name: OWASP ZAP Baseline Scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Resolve target URL
              id: target
              run: |
                  URL="${{ github.event.inputs.target_url }}"
                  if [ -z "$URL" ]; then
                    URL="${{ vars.DAST_TARGET_URL }}"
                  fi
                  if [ -z "$URL" ]; then
                    echo "No target URL supplied. Set the DAST_TARGET_URL repository variable or pass it via workflow_dispatch." >&2
                    exit 1
                  fi
                  echo "url=$URL" >> "$GITHUB_OUTPUT"

            - name: OWASP ZAP Baseline Scan
              uses: zaproxy/action-baseline@v0.13.0
              with:
                  target: ${{ steps.target.outputs.url }}
                  rules_file_name: ".zap/rules.tsv"
                  cmd_options: >
                      -j
                      -a
                      -T 120
                  fail_action: false # Report only — don't fail the build on findings
                  allow_issue_writing: true
                  artifact_name: zap-report

            - name: Upload ZAP report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: zap-report
                  path: report_html.html
                  retention-days: 30
