apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hope-agent-api-deny-egress-default
  namespace: hope-agent
spec:
  podSelector:
    matchLabels: { app: hope-agent-api }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { name: data } }
    - to:
        - namespaceSelector: { matchLabels: { name: workflows } }
    - to:
        - namespaceSelector: { matchLabels: { name: observability } }
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hope-agent-api-allow-ingress
  namespace: hope-agent
spec:
  podSelector:
    matchLabels: { app: hope-agent-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: hope-agent-gateway } }
      ports:
        - protocol: TCP
          port: 8080
