apiVersion: v1
kind: Namespace
metadata:
  name: hope-agent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hope-agent-config
  namespace: hope-agent
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Otel__Endpoint: "http://otel-collector.observability.svc.cluster.local:4317"
  Kafka__BootstrapServers: "kafka.data.svc.cluster.local:9092"
  Qdrant__Host: "qdrant.data.svc.cluster.local"
  Temporal__TargetHost: "temporal-frontend.workflows.svc.cluster.local:7233"
---
apiVersion: v1
kind: Secret
metadata:
  name: hope-agent-secrets
  namespace: hope-agent
type: Opaque
stringData:
  ConnectionStrings__Postgres: "Host=postgres.data.svc.cluster.local;Port=5432;Database=hope_agent;Username=hope;Password=REPLACE_ME"
  ConnectionStrings__Redis: "redis.data.svc.cluster.local:6379"
  Jwt__Secret: "REPLACE_ME_WITH_32+CHARS"
  LLM__OpenAI__ApiKey: ""
  LLM__Anthropic__ApiKey: ""
  LLM__Gemini__ApiKey: ""
